<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <title>Bold Report Viewer</title>
    <link href="https://cdn.boldreports.com/5.1.20/content/material/bold.reports.all.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.boldreports.com/7.1.9/scripts/common/bold.reports.common.min.js"></script>
    <script src="https://cdn.boldreports.com/7.1.9/scripts/common/bold.reports.widgets.min.js"></script>
    <script src="https://cdn.boldreports.com/7.1.9/scripts/bold.report-viewer.min.js"></script>


</head>
<body>
<div id="viewer" style="height: 100vh; width: 100%;"></div>
<script type="text/javascript">
    window.addEventListener('message', function (event) {

 const { reportServiceUrl, reportPath, xmlPayload } = event.data;
  const processedData = typeof xmlPayload === 'string' ? xmlPayload : JSON.stringify(xmlPayload);


      $("#viewer").boldReportViewer({
        reportServiceUrl:reportServiceUrl ,
        reportPath:reportPath ,
        parameters: [{
          name: "pXMLFILE",
          labels: ["pXMLFILE"],
          values: [xmlPayload]
        }],
          dataSources: [{
            name: "DataSet1",
            value: {
              data: xmlPayload
            }
          }],
      });
    });
</script>

</body>
</html>
