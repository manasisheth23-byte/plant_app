<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.boldbi.com/embedded-sdk/latest/boldbi-embed.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        #dashboard {
            height: 100%;
            width: 100%;
        }
    </style>
    <script>
        window.onload = function () {
          var dashboard = BoldBI.create({
            serverUrl: "__SERVER_URL__",
            dashboardId: "__DASHBOARD_ID__",
            embedContainerId: "dashboard",
            embedType:"component",
            environment: "onpremise",
            mode: BoldBI.Mode.View,
            expirationTime: 10000,

            // ? IMPORTANT: Remove embedQuerString and dashboardServerApiUrl from here
            authorizationServer: {
              url: "__URL__",
              beforeSend: function () {
                console.log("Calling Authorization Server API:", this.url);
              }
            }
          });

          dashboard.loadDashboard();
        };
    </script>

</head>
<body>
<div id="dashboard"></div>
</body>
</html>
