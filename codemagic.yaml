
workflows:
  flutter-ios-unsigned:
    name: Flutter iOS Unsigned IPA Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Check Flutter environment
        script: |
          flutter --version
          xcodebuild -version

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          if [ -f ios/Podfile ]; then
            cd ios
            pod install
            cd ..
          fi

      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          set -e

          APP_PATH="build/ios/iphoneos/Runner.app"
          IPA_DIR="build/ios/unsigned_ipa"
          PAYLOAD_DIR="$IPA_DIR/Payload"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found at $APP_PATH"
            find build/ios -name "*.app" -print || true
            exit 1
          fi

          rm -rf "$IPA_DIR"
          mkdir -p "$PAYLOAD_DIR"

          cp -R "$APP_PATH" "$PAYLOAD_DIR/Runner.app"

          cd "$IPA_DIR"
          zip -qr ../Runner-unsigned.ipa Payload

          echo "Unsigned IPA created:"
          ls -lh ../Runner-unsigned.ipa

      - name: Verify IPA
        script: |
          test -f build/ios/Runner-unsigned.ipa
          unzip -l build/ios/Runner-unsigned.ipa | head -30

    artifacts:
      - build/ios/Runner-unsigned.ipa
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
