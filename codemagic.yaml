
workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic CI

    environment:
      flutter: 3.35.7
      xcode: 26.0

      vars:
        BUNDLE_ID: com.cloud9.c9plantapp

    scripts:
      - name: Flutter Packages
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          export LANG=en_US.UTF-8
          cd ios
          pod install --repo-update
          cd ..

      - name: Fetch App Store Signing Files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Install Signing Certificate
        script: |
          keychain initialize
          keychain add-certificates

      - name: Apply Code Signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --verbose \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

      email:
        recipients:
          - cloud9ebizind@gmail.com
          - asmitabagal@gmail.com
        notify:
          success: true
          failure: true
